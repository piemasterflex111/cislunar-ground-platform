name: cislunar-ground

# Phase 2 runs only the telemetry path. HTTPS and mutual Transport Layer
# Security (mTLS) are intentionally deferred to Phase 5; the HTTP listeners
# below are local-development interfaces and are bound to 127.0.0.1.

x-python-service: &python-service
  build:
    context: ..
    dockerfile: Dockerfile
  restart: unless-stopped
  init: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]

x-ground-data-environment: &ground-data-environment
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ground}:${POSTGRES_PASSWORD:-ground-local-password}@postgres:5432/${POSTGRES_DB:-ground}
  REDIS_URL: redis://redis:6379/0

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    networks: [ground-internal]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ground}
      POSTGRES_USER: ${POSTGRES_USER:-ground}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ground-local-password}
    expose: ["5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ground} -d ${POSTGRES_DB:-ground}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    restart: unless-stopped
    networks: [ground-internal]
    expose: ["6379"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  ground-api:
    <<: *python-service
    command:
      - uvicorn
      - mission_ground.services.ground_api:app
      - --host
      - 0.0.0.0
      - --port
      - "8080"
    networks: [vendor-edge, ground-internal]
    environment:
      <<: *ground-data-environment
      # Phase 2 teaching credentials only. Phase 5 replaces vendor token
      # authentication with HTTPS/mTLS machine identity.
      VENDOR_TOKEN: ${VENDOR_TOKEN:-local-phase2-vendor-token}
      OPERATOR_TOKEN: ${OPERATOR_TOKEN:-local-phase2-operator-token}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-local-phase2-admin-token}
    ports:
      - "127.0.0.1:${GROUND_API_HOST_PORT:-8080}:8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/readyz', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  payload-worker:
    <<: *python-service
    command: ["python", "-m", "mission_ground.services.payload_worker"]
    networks: [ground-internal]
    environment:
      <<: *ground-data-environment
    healthcheck:
      test: ["CMD", "python", "-m", "mission_ground.services.payload_worker", "--healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  vendor-simulator:
    <<: *python-service
    command:
      - uvicorn
      - mission_ground.services.vendor_simulator:app
      - --host
      - 0.0.0.0
      - --port
      - "8081"
    networks: [vendor-edge]
    environment:
      GROUND_API_URL: http://ground-api:8080
      # This static token is a local Phase 2 teaching credential, not
      # production-grade machine authentication.
      VENDOR_TOKEN: ${VENDOR_TOKEN:-local-phase2-vendor-token}
      SIM_AUTO_SEND_INTERVAL_SECONDS: ${SIM_AUTO_SEND_INTERVAL_SECONDS:-0}
      SIM_BOOT_ID_FILE: /var/lib/ground/vendor/boot_id
    ports:
      - "127.0.0.1:${VENDOR_SIMULATOR_HOST_PORT:-8081}:8081"
    volumes:
      - vendor-sim-data:/var/lib/ground/vendor
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/healthz', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    depends_on:
      ground-api:
        condition: service_healthy

networks:
  # The vendor simulator can reach the gateway but does not join the data
  # network. Phase 5 adds HTTPS/mTLS and verifies the complete port policy.
  vendor-edge:
    driver: bridge
  ground-internal:
    driver: bridge
    internal: true

volumes:
  postgres-data:
  redis-data:
  vendor-sim-data:
