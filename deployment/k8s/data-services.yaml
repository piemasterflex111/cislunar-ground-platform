apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nats
  namespace: ground-platform
spec:
  serviceName: nats
  replicas: 1
  selector: {matchLabels: {app: nats}}
  template:
    metadata: {labels: {app: nats}}
    spec:
      containers:
        - name: nats
          image: nats:2.11-alpine
          args: ["-js", "-sd", "/data", "-m", "8222"]
          ports: [{name: client, containerPort: 4222}, {name: monitor, containerPort: 8222}]
          readinessProbe: {httpGet: {path: /healthz, port: monitor}, initialDelaySeconds: 3, periodSeconds: 5}
          volumeMounts: [{name: data, mountPath: /data}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 2Gi}}}
---
apiVersion: v1
kind: Service
metadata: {name: nats, namespace: ground-platform}
spec: {selector: {app: nats}, ports: [{name: client, port: 4222}, {name: monitor, port: 8222}]}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: ground-platform
spec:
  serviceName: postgres
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          env:
            - {name: POSTGRES_DB, value: ground}
            - {name: POSTGRES_USER, value: ground}
            - {name: POSTGRES_PASSWORD, value: ground-local-password}
          ports: [{name: postgres, containerPort: 5432}]
          readinessProbe: {exec: {command: ["pg_isready", "-U", "ground"]}, initialDelaySeconds: 5, periodSeconds: 5}
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 5Gi}}}
---
apiVersion: v1
kind: Service
metadata: {name: postgres, namespace: ground-platform}
spec: {selector: {app: postgres}, ports: [{name: postgres, port: 5432}]}
