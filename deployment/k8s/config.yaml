apiVersion: v1
kind: ConfigMap
metadata:
  name: ground-config
  namespace: ground-platform
data:
  NATS_URL: nats://nats:4222
  DATABASE_URL: postgresql://ground:ground-local-password@postgres:5432/ground
  TELEMETRY_TARGET_HOST: telemetry-ingest
  TELEMETRY_TARGET_PORT: "5005"
  COMMAND_TARGET_HOST: spacecraft-sim
  COMMAND_TARGET_PORT: "5006"
---
apiVersion: v1
kind: Secret
metadata:
  name: ground-secrets
  namespace: ground-platform
type: Opaque
stringData:
  OPERATOR_TOKEN: replace-me
  COMMAND_ARM_TOKEN: replace-me-too
