global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: spacecraft-sim
    static_configs: [{targets: ["spacecraft-sim:9101"]}]
  - job_name: telemetry-ingest
    static_configs: [{targets: ["telemetry-ingest:9102"]}]
  - job_name: telemetry-processor
    static_configs: [{targets: ["telemetry-processor:9103"]}]
  - job_name: mission-api
    metrics_path: /metrics
    static_configs: [{targets: ["mission-api:8080"]}]
  - job_name: command-dispatcher
    static_configs: [{targets: ["command-dispatcher:9104"]}]
  - job_name: ai-advisor
    static_configs: [{targets: ["ai-advisor:9105"]}]
